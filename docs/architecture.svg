<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1d2a44"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a94a6"/></marker>
  </defs>
  <rect width="1100" height="780" fill="#f6fbff"/>
  <text x="550" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1d2a44">Pip - English Buddy for Children Under 7 : System Architecture</text>

  <!-- CLIENT -->
  <rect x="60" y="60" width="620" height="110" rx="14" fill="#fff3d6" stroke="#ff8a1f" stroke-width="2"/>
  <text x="80" y="88" font-size="16" font-weight="700" fill="#1d2a44">1  Child's device - mobile / tablet / desktop browser (static/index.html)</text>
  <text x="80" y="114" font-size="13" fill="#1d2a44">Big tap-to-answer buttons (pre-readers)  |  Level stars + progress</text>
  <text x="80" y="136" font-size="13" fill="#1d2a44">Text-to-speech reads every reply  |  Speech-to-text mic (Web Speech API, runs on-device)</text>
  <text x="80" y="158" font-size="13" fill="#1d2a44">Anonymous device ID in localStorage (no account, no PII)</text>

  <line x1="370" y1="170" x2="370" y2="214" stroke="#1d2a44" stroke-width="2" marker-end="url(#a)"/>
  <text x="382" y="196" font-size="12" fill="#1d2a44">HTTPS  POST /api/chat {session_id, message}  ->  {reply, mode, quick_replies, progress}</text>

  <!-- API -->
  <rect x="60" y="216" width="620" height="76" rx="14" fill="#e3f4ea" stroke="#1f9d63" stroke-width="2"/>
  <text x="80" y="242" font-size="16" font-weight="700" fill="#1d2a44">2  API service - FastAPI / uvicorn (app/main.py)</text>
  <text x="80" y="264" font-size="13" fill="#1d2a44">Input validation  |  load profile -> engine.handle() -> save profile  |  X-Response-Time header</text>
  <text x="80" y="282" font-size="13" fill="#1d2a44">Container: Dockerfile  ->  Render / Railway / Fly.io / Cloud Run (one stateless-ish worker per container)</text>

  <line x1="370" y1="292" x2="370" y2="326" stroke="#1d2a44" stroke-width="2" marker-end="url(#a)"/>

  <!-- ENGINE -->
  <rect x="60" y="328" width="620" height="372" rx="14" fill="#ffffff" stroke="#1d2a44" stroke-width="2"/>
  <text x="80" y="354" font-size="16" font-weight="700" fill="#1d2a44">3  Dialog Engine (app/engine.py, detect.py) - pure Python, ~1 ms / turn, no network</text>

  <rect x="80" y="372" width="270" height="62" rx="10" fill="#ffe3ea" stroke="#e0527a" stroke-width="1.5"/>
  <text x="92" y="394" font-size="14" font-weight="700" fill="#1d2a44">3a  Safety + Emotion detector</text>
  <text x="92" y="413" font-size="12" fill="#1d2a44">sad / angry / scared / tired / frustrated /</text>
  <text x="92" y="427" font-size="12" fill="#1d2a44">bored / happy;  "tell a grown-up" phrases</text>

  <rect x="390" y="372" width="270" height="62" rx="10" fill="#e8e4ff" stroke="#6a5acd" stroke-width="1.5"/>
  <text x="402" y="394" font-size="14" font-weight="700" fill="#1d2a44">3b  Child-mode detector</text>
  <text x="402" y="413" font-size="12" fill="#1d2a44">Priority: wellbeing > explicit ask > lesson</text>
  <text x="402" y="427" font-size="12" fill="#1d2a44">in flight > brain-break > chat (max 2 turns)</text>
  <line x1="350" y1="403" x2="388" y2="403" stroke="#1d2a44" stroke-width="2" marker-end="url(#a)"/>

  <line x1="525" y1="434" x2="525" y2="462" stroke="#1d2a44" stroke-width="2" marker-end="url(#a)"/>
  <text x="535" y="452" font-size="11" fill="#1d2a44">route by mode</text>

  <!-- 4 handlers -->
  <rect x="80" y="466" width="140" height="120" rx="10" fill="#d9f2e4" stroke="#1f9d63" stroke-width="1.5"/>
  <text x="150" y="488" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2a44">LEARNING</text>
  <text x="150" y="508" text-anchor="middle" font-size="11" fill="#1d2a44">new word / exercise</text>
  <text x="150" y="524" text-anchor="middle" font-size="11" fill="#1d2a44">check answer, hint,</text>
  <text x="150" y="540" text-anchor="middle" font-size="11" fill="#1d2a44">reveal, praise,</text>
  <text x="150" y="556" text-anchor="middle" font-size="11" fill="#1d2a44">level up / down</text>

  <rect x="232" y="466" width="140" height="120" rx="10" fill="#dff0ff" stroke="#2b7bd1" stroke-width="1.5"/>
  <text x="302" y="488" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2a44">CONVERSATION</text>
  <text x="302" y="508" text-anchor="middle" font-size="11" fill="#1d2a44">greet, share, interests</text>
  <text x="302" y="524" text-anchor="middle" font-size="11" fill="#1d2a44">curiosity questions,</text>
  <text x="302" y="540" text-anchor="middle" font-size="11" fill="#1d2a44">soft lesson offer</text>
  <text x="302" y="556" text-anchor="middle" font-size="11" fill="#1d2a44">after 2 turns</text>

  <rect x="384" y="466" width="140" height="120" rx="10" fill="#fff0d9" stroke="#ff8a1f" stroke-width="1.5"/>
  <text x="454" y="488" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2a44">ENGAGEMENT</text>
  <text x="454" y="508" text-anchor="middle" font-size="11" fill="#1d2a44">riddles, move games,</text>
  <text x="454" y="524" text-anchor="middle" font-size="11" fill="#1d2a44">brain break after</text>
  <text x="454" y="540" text-anchor="middle" font-size="11" fill="#1d2a44">4 lessons, bored or</text>
  <text x="454" y="556" text-anchor="middle" font-size="11" fill="#1d2a44">disengaged child</text>

  <rect x="536" y="466" width="124" height="120" rx="10" fill="#ffe3ea" stroke="#e0527a" stroke-width="1.5"/>
  <text x="598" y="488" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2a44">SUPPORT / SEL</text>
  <text x="598" y="508" text-anchor="middle" font-size="11" fill="#1d2a44">name the feeling,</text>
  <text x="598" y="524" text-anchor="middle" font-size="11" fill="#1d2a44">validate, breathe,</text>
  <text x="598" y="540" text-anchor="middle" font-size="11" fill="#1d2a44">choices, grown-up</text>
  <text x="598" y="556" text-anchor="middle" font-size="11" fill="#1d2a44">hand-off</text>

  <!-- curriculum -->
  <rect x="80" y="610" width="360" height="72" rx="10" fill="#f0fff6" stroke="#1f9d63" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="92" y="632" font-size="14" font-weight="700" fill="#1d2a44">Curriculum + progression (curriculum.py)</text>
  <text x="92" y="650" font-size="11" fill="#1d2a44">L1 sounds/pick | L2 name/spell | L3 sentence blanks</text>
  <text x="92" y="666" font-size="11" fill="#1d2a44">up: 5 correct, 80% of last 6 | down: 3 misses | weak-word review</text>
  <line x1="150" y1="586" x2="150" y2="608" stroke="#1f9d63" stroke-width="2" marker-end="url(#a)"/>

  <rect x="460" y="610" width="200" height="72" rx="10" fill="#fffbe8" stroke="#c9a400" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="472" y="632" font-size="14" font-weight="700" fill="#1d2a44">Context signals</text>
  <text x="472" y="650" font-size="11" fill="#1d2a44">name, level, weak/mastered words,</text>
  <text x="472" y="666" font-size="11" fill="#1d2a44">interests, last emotions, history</text>

  <!-- STORE -->
  <rect x="740" y="216" width="320" height="170" rx="14" fill="#eef1f6" stroke="#5b6b85" stroke-width="2"/>
  <text x="760" y="242" font-size="16" font-weight="700" fill="#1d2a44">4  Profile store (store.py)</text>
  <text x="760" y="266" font-size="12" fill="#1d2a44">One small JSON profile per child (&lt; 2 KB):</text>
  <text x="760" y="284" font-size="12" fill="#1d2a44">level, progress, word mastery, weak words,</text>
  <text x="760" y="302" font-size="12" fill="#1d2a44">interests, emotion log, last 10 turns</text>
  <text x="760" y="326" font-size="12" fill="#1d2a44">In-memory cache (TTL)  +  write-through JSON</text>
  <text x="760" y="344" font-size="12" fill="#1d2a44">Swap-in: Redis / Postgres (same get/save API)</text>
  <text x="760" y="368" font-size="12" fill="#1d2a44">Read ~0 ms (cache)  |  write ~0.1 ms</text>
  <line x1="680" y1="254" x2="738" y2="254" stroke="#1d2a44" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- LLM -->
  <rect x="740" y="430" width="320" height="170" rx="14" fill="#f3ecff" stroke="#6a5acd" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="760" y="456" font-size="16" font-weight="700" fill="#1d2a44">5  Optional LLM (llm.py)</text>
  <text x="760" y="480" font-size="12" fill="#1d2a44">Claude Haiku-class model, free chat ONLY</text>
  <text x="760" y="498" font-size="12" fill="#1d2a44">Kid-safe system prompt, max_tokens 60</text>
  <text x="760" y="516" font-size="12" fill="#1d2a44">Hard timeout 1.0 s -> falls back to the</text>
  <text x="760" y="534" font-size="12" fill="#1d2a44">template reply (never blocks a lesson)</text>
  <text x="760" y="558" font-size="12" fill="#1d2a44">Lessons, SEL, modes, safety: never LLM</text>
  <text x="760" y="582" font-size="12" fill="#1d2a44">Off when no API key is set</text>
  <path d="M680 520 L738 520" stroke="#8a94a6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#d)"/>
  <text x="684" y="512" font-size="10" fill="#5b6b85">free chat</text>

  <!-- LATENCY -->
  <rect x="740" y="630" width="320" height="70" rx="14" fill="#e3f4ea" stroke="#1f9d63" stroke-width="2"/>
  <text x="760" y="654" font-size="14" font-weight="700" fill="#1d2a44">Latency budget (target &lt; 2 s)</text>
  <text x="760" y="674" font-size="12" fill="#1d2a44">Lesson / SEL turn: ~5-50 ms server + network</text>
  <text x="760" y="692" font-size="12" fill="#1d2a44">Free chat w/ LLM: worst case ~1.2 s + network</text>

  <text x="550" y="740" text-anchor="middle" font-size="12" fill="#5b6b85">Solid arrows = synchronous request path.  Dashed = optional / best-effort path.  No child text leaves the server except the capped LLM call on free chat.</text>
</svg>
